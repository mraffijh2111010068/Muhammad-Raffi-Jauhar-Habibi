<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjumlahan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #4db8c4;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        input[readonly] {
            background: rgba(255, 255, 255, 0.6);
            cursor: not-allowed;
            font-weight: 600;
            color: #333;
        }

        .result-group {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
        }

        .info {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Penjumlahan</h2>
        
        <div class="input-group">
            <label for="nilai1">Nilai Pertama :</label>
            <input type="number" id="nilai1" placeholder="Masukkan nilai pertama">
        </div>
        
        <div class="input-group">
            <label for="nilai2">Nilai ke dua:</label>
            <input type="number" id="nilai2" placeholder="Masukkan nilai kedua">
        </div>
        
        <div class="input-group result-group">
            <label for="hasil">Hasil :</label>
            <input type="text" id="hasil" readonly placeholder="Hasil akan muncul di sini">
        </div>
        
        <div class="info">
            Hasil akan muncul secara otomatis
        </div>
    </div>

    <script>
        const nilai1Input = document.getElementById('nilai1');
        const nilai2Input = document.getElementById('nilai2');
        const hasilInput = document.getElementById('hasil');

        function hitungPenjumlahan() {
            const nilai1 = parseFloat(nilai1Input.value) || 0;
            const nilai2 = parseFloat(nilai2Input.value) || 0;
            
            if (nilai1Input.value === '' && nilai2Input.value === '') {
                hasilInput.value = '';
            } else {
                const hasil = nilai1 + nilai2;
                hasilInput.value = hasil;
            }
        }

        nilai1Input.addEventListener('input', hitungPenjumlahan);
        nilai2Input.addEventListener('input', hitungPenjumlahan);
    </script>
</body>
</html>
